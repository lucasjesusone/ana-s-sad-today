<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pra você ❤️</title>

<style>
    body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #ffdde1, #ee9ca7);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        width: 90%;
        max-width: 600px;
        color: #ffffff;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
        position: relative;
        z-index: 2;
    }

    #dog {
        width: 200px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    #message {
        font-size: 22px;
        min-height: 150px;
        white-space: pre-line;
    }

    button {
        margin-top: 25px;
        padding: 14px 28px;
        background: #ffffff;
        border: none;
        color: #d6336c;
        font-weight: bold;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(255,255,255,0.4);
        display: none;
    }

    /* pétalas */
    .petal {
        position: fixed;
        top: -10px;
        width: 20px;
        height: 20px;
        background: pink;
        border-radius: 80% 50% 80% 50%;
        opacity: 0.7;
        animation: fall linear infinite;
        z-index: 1;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }

    /* Tela inicial para desbloquear áudio */
    #startScreen {
        position: fixed;
        inset: 0;
        background: rgba(0,0,0,0.8);
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        color: white;
        font-family: Arial;
        text-align: center;
        z-index: 10;
    }

    #startScreen button {
        padding: 14px 28px;
        margin-top: 20px;
        background: #fff;
        color: #d6336c;
        border-radius: 10px;
        border: none;
        font-size: 18px;
        font-weight: bold;
        cursor: pointer;
    }
</style>
</head>

<body>

<!-- Tela inicial obrigatória para liberar áudio no celular -->
<div id="startScreen">
    <h2>Toque para começar 💗</h2>
    <button onclick="startApp()">Começar 🎶</button>
</div>

<!-- Música -->
<audio id="bgm" preload="auto" loop>
    <source src="your-song.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <img id="dog" src="sad-dog.jpg" alt="Cachorro triste">
    <div id="message"></div>
    <button id="btn">Clique aqui ❤️</button>
</div>

<script>
function startApp() {
    const start = document.getElementById("startScreen");
    const audio = document.getElementById("bgm");

    start.style.display = "none";

    audio.play()
        .then(() => {
            console.log("🎵 Música iniciada com sucesso");
            iniciarMensagens();
        })
        .catch(err => {
            console.log("⚠ Erro ao tocar música:", err);
            iniciarMensagens(); // continua mesmo sem áudio
        });
}

function iniciarMensagens() {
    const msgBox = document.getElementById("message");
    const btn = document.getElementById("btn");

    const mensagem1 = "Ouça essa música… 🎶\n\n(espera um pouquinho…)";

    const mensagemFinal = `
Obrigado por existir, querida..

você é especial d+++++++++

Te amo Sweetheart...

I LOVE YOU <33333
`;

    let speedInitial = 50;
    let speedFinal = 55;

    function typeWriter(text, speed, callback) {
        let i = 0;
        function typing() {
            if (i < text.length) {
                msgBox.innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, speed);
            } else if (callback) callback();
        }
        typing();
    }

    typeWriter(mensagem1, speedInitial, () => {
        setTimeout(() => {
            msgBox.innerHTML = "";
            typeWriter(mensagemFinal, speedFinal, () => {
                btn.style.display = "inline-block";
            });
        }, 6000); // aumenta tempo de espera
    });

    btn.onclick = () => {
        alert("Quero te ver sorrir ❤️");
    };

    // pétalas caindo
    function createPetal() {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (5 + Math.random() * 5) + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 11000);
    }

    setInterval(createPetal, 400);
}
</script>

</body>
</html>

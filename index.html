<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Desculpas ❤️</title>

  <style>
    body {
      margin: 0;
      padding: 0;
      background: #f0f0f0;
      font-family: Arial, sans-serif;
      text-align: center;
    }

    #container {
      padding: 20px;
    }

    #dog {
      display: none; /* 👈 escondido inicialmente */
      margin-top: 20px;
      width: 300px;
      border-radius: 12px;
    }

    #btnStart {
      padding: 15px 25px;
      background: #ff4f70;
      color: white;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
      margin-top: 30px;
    }

  </style>
</head>
<body>

  <div id="container">

    <h1>Eu errei… 😢</h1>
    <p>Mas quero me redimir de um jeito especial!</p>

    <button id="btnStart">Começar</button>

    <img id="dog" src="https://i.imgur.com/3ZQ3Z8h.jpeg" alt="Cachorrinho triste">

  </div>

  <audio id="music" src="musica.mp3"></audio>

  <script>
    const dog = document.getElementById("dog");
    const btn = document.getElementById("btnStart");
    const music = document.getElementById("music");

    btn.addEventListener("click", () => {
      dog.style.display = "block";    // 👈 mostra o dog
      music.play();                    // toca música
      btn.style.display = "none";      // tira o botão se quiser
    });
  </script>
</body>
</html>

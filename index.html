<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Para Você 💖</title>

<style>
    body {
        margin: 0;
        padding: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #ffd3e3, #ffb6c9);
        height: 100vh;
        overflow: hidden;
        text-align: center;
    }

    #container {
        position: relative;
        z-index: 10;
        padding-top: 40px;
        color: #7a2640;
    }

    .typing {
        font-size: 22px;
        width: 90%;
        margin: 0 auto;
        min-height: 160px;
        white-space: pre-wrap;
        line-height: 1.5;
    }

    #startBtn {
        padding: 15px 25px;
        font-size: 20px;
        border: none;
        border-radius: 10px;
        background: #ff4f81;
        color: white;
        cursor: pointer;
        margin-top: 20px;
        transition: 0.2s;
    }
    #startBtn:hover {
        background: #ff2d6d;
    }

    #dog {
        width: 280px;
        margin-top: 20px;
        border-radius: 12px;
        box-shadow: 0 4px 15px rgba(0,0,0,0.2);
    }

    /* Pétalas caindo */
    .petal {
        position: fixed;
        top: -10vh;
        width: 20px;
        height: 20px;
        background-image: url("https://i.imgur.com/4ZQZ4qT.png");
        background-size: cover;
        opacity: 0.8;
        animation: fall linear infinite;
    }

    @keyframes fall {
        from { transform: translateY(-10vh) rotate(0deg); }
        to { transform: translateY(110vh) rotate(360deg); }
    }
</style>
</head>
<body>

    <div id="container">
        <h2>💗 Oi, honey 💗</h2>

        <p class="typing" id="text"></p>

        <button id="startBtn">Toque para começar... 🎵</button>

        <br>
        <img id="dog" src="sad-dog.jpg" alt="Cachorro fofo">
    </div>


    <!-- Música -->
    <audio id="song" src="your-song.mp3"></audio>

<script>
    const btn = document.getElementById("startBtn");
    const song = document.getElementById("song");
    const textElement = document.getElementById("text");

    const mensagem = 
`
Obrigado por existir, querida..

você é especial d+++++++++

Te amo Sweetheart...

I LOVE YOU <33333
`;

    let i = 0;

    function typeWriter() {
        if (i < mensagem.length) {
            textElement.innerHTML += mensagem.charAt(i);
            i++;
            setTimeout(typeWriter, 60); 
        }
    }

    // Botão para tocar música
    btn.addEventListener("click", () => {
        song.play();
        btn.style.display = "none";
        typeWriter();
    });

    // Criar pétalas
    function criarPetalas() {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = 3 + Math.random() * 5 + "s";
        document.body.appendChild(petal);

        setTimeout(() => petal.remove(), 8000);
    }

    setInterval(criarPetalas, 400);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<title>Pra você ❤️</title>
<style>
    body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #ffdde1, #ee9ca7);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        width: 90%;
        max-width: 600px;
        color: #ffffff;
        text-shadow: 2px 2px 6px rgba(0,0,0,0.4);
        position: relative;
    }

    #dog {
        width: 200px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0,0,0,0.4);
    }

    #message {
        font-size: 22px;
        min-height: 150px;
        white-space: pre-line;
    }

    #start {
        padding: 16px 32px;
        background: #ffffff;
        border: none;
        color: #d6336c;
        font-weight: bold;
        border-radius: 10px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(255,255,255,0.4);
        margin-bottom: 25px;
    }

    button {
        margin-top: 25px;
        padding: 14px 28px;
        background: #ffffff;
        border: none;
        color: #d6336c;
        font-weight: bold;
        border-radius: 10px;
        font-size: 18px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(255,255,255,0.4);
        display: none;
    }

    .petal {
        position: fixed;
        top: -10px;
        width: 20px;
        height: 20px;
        background: pink;
        border-radius: 80% 50% 80% 50%;
        opacity: 0.7;
        animation: fall linear infinite;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>
</head>
<body>

<!-- Música só inicia no clique -->
<audio id="bgm">
    <source src="your-song.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <button id="start">Toque aqui para começar... &lt;3</button>

    <img id="dog" src="sad-dog.jpg" alt="Cachorro triste" style="display:none;">
    <div id="message"></div>
    <button id="btn">Clique aqui ❤️</button>
</div>

<script>
    const bgm = document.getElementById("bgm");
    const start = document.getElementById("start");
    const dog = document.getElementById("dog");
    const msgBox = document.getElementById("message");
    const btn = document.getElementById("btn");

    const mensagem1 = "Ouça essa música… 🎶\n\n(espera um pouquinho…)";

    const mensagemFinal = `
Obrigado por existir, querida..

você é especial d+++++++++

Te amo Sweetheart...

I LOVE YOU <33333
`;

    let speedInitial = 75; 
    let speedFinal = 75;

    function typeWriter(text, speed, callback) {
        let i = 0;
        function typing() {
            if (i < text.length) {
                msgBox.innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, speed);
            } else if (callback) {
                callback();
            }
        }
        typing();
    }

    function startEverything() {
        start.style.display = "none";
        dog.style.display = "block";

        bgm.play();

        typeWriter(mensagem1, speedInitial, () => {
            setTimeout(() => {
                msgBox.innerHTML = "";
                typeWriter(mensagemFinal, speedFinal, () => {
                    btn.style.display = "inline-block";
                });
            }, 12000);
        });

        setInterval(createPetal, 400);
    }

    start.onclick = startEverything;

    btn.onclick = () => {
        alert("Quero te ver sorrir ❤️");
    };

    function createPetal() {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (4 + Math.random() * 5) + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 9000);
    }
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Pra você ❤️</title>

<style>
    body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #ffdde1, #ee9ca7);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        width: 90%;
        max-width: 600px;
        color: #ffffff;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    #dog {
        width: 200px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        display: none; /* 👈 ESCONDIDO INICIALMENTE */
    }

    #message {
        font-size: 22px;
        min-height: 150px;
        white-space: pre-line;
    }

    button {
        padding: 16px 32px;
        background: #ffffff;
        border: none;
        color: #d6336c;
        font-weight: bold;
        border-radius: 10px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(255, 255, 255, 0.4);
        margin-bottom: 25px;
    }

    #btn {
        display: none;
    }

    .petal {
        position: fixed;
        top: -10px;
        width: 20px;
        height: 20px;
        background: pink;
        border-radius: 80% 50% 80% 50%;
        opacity: 0.7;
        animation: fall linear infinite;
    }

    @keyframes fall {
        to {
            transform: translateY(110vh) rotate(360deg);
            opacity: 0;
        }
    }
</style>

</head>

<body>

<audio id="bgm" loop>
    <source src="your-song.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <button id="start">Toque aqui para começar ❤️</button>

    <img id="dog" src="sad-dog.jpg" alt="Cachorro triste">

    <div id="message"></div>

    <button id="btn">Clique aqui para um lembrete especial ❤️</button>
</div>

<script>
    const msgBox = document.getElementById("message");
    const btn = document.getElementById("btn");
    const startBtn = document.getElementById("start");
    const audio = document.getElementById("bgm");
    const dog = document.getElementById("dog"); // 👈 PEGAR DOG

    const mensagem1 = "Ouça essa música… 🎶\n\n(espera um pouquinho…)";

    const mensagemFinal = `
Obrigado por existir, querida..

você é especial d+++++++++

Te amo Sweetheart...

I LOVE YOU <33333
`;

    let speedInitial = 75;
    let speedFinal = 75;

    function typeWriter(text, speed, callback) {
        let i = 0;
        function typing() {
            if (i < text.length) {
                msgBox.innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, speed);
            } else if (callback) callback();
        }
        typing();
    }

    // Botão de início
    startBtn.onclick = () => {
        startBtn.style.display = "none";

        dog.style.display = "block";  /* 👈 MOSTRAR DOG SOMENTE AQUI */

        audio.play()
            .catch(() => console.log("Autoplay bloqueado, mas continua."));

        typeWriter(mensagem1, speedInitial, () => {
            setTimeout(() => {
                msgBox.innerHTML = "";
                typeWriter(mensagemFinal, speedFinal, () => {
                    btn.style.display = "inline-block";
                });
            }, 12000);
        });
    };

    btn.onclick = () => {
        alert("Quero te ver sorrir ❤️");
    };

    function createPetal() {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (4 + Math.random() * 5) + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 9000);
    }

    setInterval(createPetal, 400);
</script>

</body>
</html>

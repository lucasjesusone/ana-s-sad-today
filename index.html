<!DOCTYPE html>
<html lang="pt-br">
<head>
<meta charset="UTF-8">
<title>Para você, meu amor ❤️</title>

<style>
    body {
        margin: 0;
        padding: 0;
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
        text-align: center;
        background: url("https://images.unsplash.com/photo-1527631746610-bca00a040d60?auto=format&fit=crop&w=1350&q=80");
        background-size: cover;
        background-position: center;
        font-family: "Segoe UI", sans-serif;
    }

    .container {
        background: rgba(255, 240, 246, 0.85);
        padding: 30px;
        border-radius: 20px;
        width: 70%;
        max-width: 650px;
        box-shadow: 0px 0px 25px rgba(255, 90, 140, 0.4);
        position: relative;
        z-index: 10;
    }

    .title {
        font-size: 2rem;
        color: #d6336c;
        margin-bottom: 20px;
        font-weight: bold;
        text-shadow: 0px 0px 5px white;
    }

    .message {
        color: #6d214f;
        font-size: 1.3rem;
        line-height: 1.6;
        min-height: 180px;
        white-space: pre-wrap;
    }

    .heart {
        font-size: 3rem;
        margin-top: 20px;
        animation: beat 1s infinite;
    }

    @keyframes beat {
        0% { transform: scale(1); }
        50% { transform: scale(1.2); }
        100% { transform: scale(1); }
    }

    .dog {
        width: 250px;
        margin-top: 25px;
        border-radius: 15px;
        display: none;
        animation: fadeIn 1s ease forwards;
        box-shadow: 0px 0px 15px rgba(0,0,0,0.2);
    }

    @keyframes fadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    .forgive-btn {
        margin-top: 25px;
        padding: 12px 25px;
        font-size: 1.3rem;
        background: #ff4f7b;
        color: white;
        border: none;
        border-radius: 12px;
        cursor: pointer;
        display: none;
        animation: pop 0.5s ease forwards, pulse 1.5s infinite;
    }

    @keyframes pop {
        from { transform: scale(0.5); opacity: 0; }
        to { transform: scale(1); opacity: 1; }
    }

    @keyframes pulse {
        0% { transform: scale(1); }
        50% { transform: scale(1.06); }
        100% { transform: scale(1); }
    }

    .petal {
        position: fixed;
        top: -10vh;
        width: 25px;
        height: 25px;
        background-image: url("https://pngimg.com/uploads/rose/rose_PNG66733.png");
        background-size: contain;
        background-repeat: no-repeat;
        animation: fall linear infinite;
        opacity: 0.9;
        pointer-events: none;
        z-index: 1;
    }

    @keyframes fall {
        0% { transform: translateY(0) rotate(0deg); }
        100% { transform: translateY(110vh) rotate(360deg); }
    }
</style>
</head>

<body>

<!-- Música: Seu MP3 (coloque na raiz do repo) -->
<audio id="bgm" autoplay loop>
    <source src="your-song.mp3" type="audio/mpeg">
</audio>

<div class="container">
    <div class="title">Tenho algo importante pra te dizer... ❤️</div>
    <div class="message" id="message"></div>

    <img id="dog" class="dog"
        src="https://images.unsplash.com/photo-1601758123927-196b70a157a8?auto=format&fit=crop&w=600&q=80"
        alt="Cachorrinho triste">

    <button id="forgiveBtn" class="forgive-btn">Me perdoa? 🥺💗</button>

    <div class="heart">💖</div>
</div>

<script>
/* ---- Texto Digitado ---- */
const text = `
Você é especial.
Você é linda.
Você é maravilhosa.
Você é adorável.
E eu sou completamente sortudo por ter você na minha vida.

Eu sei que eu vacilei…
E vim aqui te pedir desculpas, com todo meu coração.

Você significa muito pra mim. ❤️
`;

let index = 0;

function typeWriter() {
    if (index < text.length) {
        document.getElementById("message").innerHTML += text.charAt(index);
        index++;
        setTimeout(typeWriter, 45);
    } else {
        setTimeout(() => {
            document.getElementById("dog").style.display = "block";
        }, 600);

        setTimeout(() => {
            document.getElementById("forgiveBtn").style.display = "inline-block";
        }, 1500);
    }
}

window.onload = typeWriter;

/* ---- Pétalas ---- */
function createPetal() {
    const petal = document.createElement("div");
    petal.classList.add("petal");
    petal.style.left = Math.random() * 100 + "vw";
    petal.style.animationDuration = 4 + Math.random() * 5 + "s";
    petal.style.opacity = Math.random() * 0.8 + 0.4;
    document.body.appendChild(petal);

    setTimeout(() => petal.remove(), 9000);
}

setInterval(createPetal, 500);
</script>

</body>
</html>

<!DOCTYPE html>
<html lang="pt-BR">

<head>
<meta charset="UTF-8">
<title>Pra você ❤️</title>

<style>
    body {
        margin: 0;
        font-family: "Arial", sans-serif;
        background: linear-gradient(135deg, #ffdde1, #ee9ca7);
        height: 100vh;
        overflow: hidden;
        display: flex;
        justify-content: center;
        align-items: center;
    }

    .container {
        text-align: center;
        width: 90%;
        max-width: 600px;
        color: #ffffff;
        text-shadow: 2px 2px 6px rgba(0, 0, 0, 0.4);
        position: relative;
    }

    #dog {
        width: 200px;
        margin-bottom: 20px;
        border-radius: 12px;
        box-shadow: 0 5px 20px rgba(0, 0, 0, 0.4);
        display: none;
    }

    .dog-container {
        width: 100%;
        display: flex;
        justify-content: center;
    }

    #message {
        font-size: 22px;
        min-height: 150px;
        white-space: pre-line;
    }

    button {
        padding: 16px 32px;
        background: #ffffff;
        border: none;
        color: #d6336c;
        font-weight: bold;
        border-radius: 10px;
        font-size: 20px;
        cursor: pointer;
        box-shadow: 0 4px 14px rgba(255, 255, 255, 0.4);
        margin-bottom: 25px;
    }

    #btn {
        display: none;
    }

    /* PETALAS DE CORAÇÃO VIBRANTES */
    .petal {
        position: fixed;
        top: -30px;
        width: 28px;
        height: 28px;
        background: radial-gradient(circle at 30% 30%, #ff1f6d, #d6004b);
        transform: rotate(45deg);
        opacity: 0.95;

        /* formato de coração */
        clip-path: polygon(
            50% 0%,
            61% 9%,
            71% 19%,
            78% 31%,
            80% 43%,
            78% 56%,
            71% 67%,
            61% 76%,
            50% 84%,
            39% 76%,
            29% 67%,
            22% 56%,
            20% 43%,
            22% 31%,
            29% 19%,
            39% 9%
        );

        box-shadow: 0 0 14px rgba(255, 40, 120, 0.9);
        animation: fallHeart linear infinite, pulse 1.2s ease-in-out infinite;
    }

    @keyframes fallHeart {
        to {
            transform: translateY(120vh) rotate(360deg);
            opacity: 0;
        }
    }

    @keyframes pulse {
        0% { transform: scale(1) rotate(45deg); }
        50% { transform: scale(1.25) rotate(45deg); }
        100% { transform: scale(1) rotate(45deg); }
    }
</style>

</head>

<body>

<audio id="bgm" loop>
    <source src="your-song.mp3" type="audio/mpeg">
</audio>

<div class="container">

    <button id="start">Toque aqui para começar ❤️</button>

    <div class="dog-container">
        <img id="dog" src="sad-dog.jpg" alt="Cachorro triste">
    </div>

    <div id="message"></div>

    <button id="btn">Clique aqui para um lembrete especial ❤️</button>
</div>

<script>
    const msgBox = document.getElementById("message");
    const btn = document.getElementById("btn");
    const startBtn = document.getElementById("start");
    const audio = document.getElementById("bgm");
    const dog = document.getElementById("dog");

    const mensagem1 = "Ouça essa música… 🎶\n\n(espera um pouquinho…)";

    const mensagemFinal = `
Obrigado por existir, querida..

você é especial d+++++++++

Te amo Sweetheart...

I LOVE YOU <33333
`;

    let speedInitial = 50;
    let speedFinal = 50;

    function typeWriter(text, speed, callback) {
        let i = 0;
        function typing() {
            if (i < text.length) {
                msgBox.innerHTML += text.charAt(i);
                i++;
                setTimeout(typing, speed);
            } else if (callback) callback();
        }
        typing();
    }

    startBtn.onclick = () => {
        startBtn.style.display = "none";
        dog.style.display = "block";

        audio.play().catch(() => console.log("Autoplay bloqueado."));

        typeWriter(mensagem1, speedInitial, () => {
            setTimeout(() => {
                msgBox.innerHTML = "";
                typeWriter(mensagemFinal, speedFinal, () => {
                    btn.style.display = "inline-block";
                });
            }, 12000);
        });
    };

    btn.onclick = () => {
        alert("Tenha um excelente dia meu amor, você é muuuuuuito especial. ❤️");
    };

    function createPetal() {
        const petal = document.createElement("div");
        petal.classList.add("petal");
        petal.style.left = Math.random() * 100 + "vw";
        petal.style.animationDuration = (4 + Math.random() * 5) + "s";
        document.body.appendChild(petal);
        setTimeout(() => petal.remove(), 9000);
    }

    setInterval(createPetal, 180); /* mais corações caindo */
</script>

</body>
</html>
